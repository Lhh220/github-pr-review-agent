name: Go regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: review_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CGO_ENABLED: "1"
      MYSQL_DSN: "root@tcp(127.0.0.1:3306)/review_test?charset=utf8mb4&parseTime=true&loc=Local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: go run ./cmd/eval -report /tmp/eval-report.json
